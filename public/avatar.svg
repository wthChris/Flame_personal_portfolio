<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" width="64" height="64">
  <rect width="16" height="16" fill="#cfe8b0"/>
  <!-- background squares -->
  <rect x="0" y="0" width="16" height="3" fill="#7da064"/>
  <rect x="0" y="3" width="16" height="2" fill="#a4c684"/>
  <!-- head -->
  <rect x="4" y="3" width="8" height="6" fill="#e8b88a"/>
  <rect x="3" y="4" width="1" height="4" fill="#e8b88a"/>
  <rect x="12" y="4" width="1" height="4" fill="#e8b88a"/>
  <!-- hair -->
  <rect x="3" y="2" width="10" height="2" fill="#1a1a1a"/>
  <rect x="2" y="3" width="2" height="2" fill="#1a1a1a"/>
  <rect x="12" y="3" width="2" height="2" fill="#1a1a1a"/>
  <!-- glasses -->
  <rect x="4" y="6" width="3" height="2" fill="#1a1a1a"/>
  <rect x="9" y="6" width="3" height="2" fill="#1a1a1a"/>
  <rect x="7" y="6" width="2" height="1" fill="#1a1a1a"/>
  <rect x="5" y="7" width="1" height="1" fill="#cfe8b0"/>
  <rect x="10" y="7" width="1" height="1" fill="#cfe8b0"/>
  <!-- mouth -->
  <rect x="6" y="9" width="4" height="1" fill="#7a3a3a"/>
  <!-- shirt -->
  <rect x="3" y="10" width="10" height="6" fill="#c33a3a"/>
  <rect x="2" y="11" width="1" height="5" fill="#c33a3a"/>
  <rect x="13" y="11" width="1" height="5" fill="#c33a3a"/>
